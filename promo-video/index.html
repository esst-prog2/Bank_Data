<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Bank_Data promo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
      }
      #root { position: relative; width: 100%; height: 100%; background: #ffffff; }
    </style>
  </head>
  <body>
    <!-- "The number that comes twice": see SPEC.md. 33.5 s, silent, captions burned in. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="33.5" data-width="1920" data-height="1080">
      <div id="twice" data-composition-id="twice" data-composition-src="compositions/twice.html"
        data-start="0" data-duration="8" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="plate" data-composition-id="plate" data-composition-src="compositions/plate.html"
        data-start="8" data-duration="7.5" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="dash" data-composition-id="dash" data-composition-src="compositions/dash.html"
        data-start="15.5" data-duration="10.5" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="claim" data-composition-id="claim" data-composition-src="compositions/claim.html"
        data-start="26" data-duration="3" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html"
        data-start="29" data-duration="4.5" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="33.5" data-track-index="2" data-track-kind="captions"
        data-width="1920" data-height="1080" style="z-index: 10"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
