[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-data"
version = "0.1.0"
description = "European Bank Financial Data Reconciliation - retrieves and tags financial-statement and regulatory data for European banks, by source and provenance, without silently combining figures across sources."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dateutil>=2.9",
    "playwright>=1.45",
    "openpyxl>=3.1",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["data_acquisition*"]
